[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    # Comments (often quoting real API messages) regularly go past 100
    # columns. The actual code stays below.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The tests deliberately build classes/fixtures with "unnatural" names and
# structures to simulate the API responses.
"tests/**" = ["B011", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
